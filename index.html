<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://joinkaro.live/funnel-tracker/track.php'; // ← EDIT ME

  var uid;
  try {
    uid = localStorage.getItem('ft_uid');
    if (!uid) {
      uid = 'UID-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('ft_uid', uid);
    }
  } catch (e) {
    uid = 'UID-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }
  window.FT_UID = uid;

  var start = Date.now();
  var clicked = 'No';
  var lastSent = 0;

  function payload() {
    return {
      user_id: uid,
      screen: (window.screen ? screen.width + 'x' + screen.height : ''),
      viewport: window.innerWidth + 'x' + window.innerHeight,
      referrer: document.referrer || '',
      page_url: location.href,
      time_spent: Math.max(0, Math.round((Date.now() - start) / 1000)),
      clicked: clicked,
      user_agent: navigator.userAgent
    };
  }

  function send(force) {
    var now = Date.now();
    if (!force && now - lastSent < 400) return;
    lastSent = now;
    var body = JSON.stringify(payload());
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(ENDPOINT, new Blob([body], { type: 'text/plain' }));
      } else {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', ENDPOINT, true);
        xhr.send(body);
      }
    } catch (e) { /* never break the page */ }
  }

  document.addEventListener('click', function (e) {
    var el = (e.target && e.target.closest) ? e.target.closest('.telegram-link') : null;
    if (el) {
      clicked = 'Yes';
      send(true);
    }
  }, true);

  window.addEventListener('pagehide', function () { send(true); });

  send(true);
})();
</script>
