<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JET BEAST - Trading Community</title>
<style>

.top{color:#fffa8a;font-weight:900;font-size:28px;padding:30px 10px 10px;line-height:1.2;letter-spacing:0.5px}
.logo{width:260px;height:260px;border-radius:50%;border:3px solid #ff3c00;box-shadow:0 0 40px #ff3c00a0;margin:20px auto;display:block;object-fit:cover}

.btn{display:block;background:#0a88d1;color:#fff;text-decoration:none;padding:18px 20px;border-radius:12px;font-weight:900;width:80%;max-width:320px;margin:25px auto;font-size:16px}
.live-box{background:#1a0a0a;border:1px solid #332;border-radius:14px;width:85%;max-width:360px;margin:20px auto;padding:12px;text-align:left}

<body>
<div class="top">INDIA's MOST<br>DEMANDING CHANNEL</div>

<div class="sub2">DON'T WAIT, JOIN NOW</div>
<a class="btn" href="https://t.me/+aw5RRcLVZkU1YWI1">✈️ JOIN NOW</a>

<div class="live-box">

</div>

<p style="font-size:9px;color:#666;padding:20px">Educational Purpose Only. We are not SEBI registered. Trading involves risk. No buy/sell advice.</p>

<script>
const names=["Rahul","Amit","Vikas","Pooja","Sanjay","Rohit"];
let el=document.getElementById('joins');
function addJoin(){
let n=names[Math.floor(Math.random()*names.length)];
el.innerHTML=`<div>🔥 ${n} joined community - just now</div>`+el.innerHTML.slice(0,200);
}
setInterval(addJoin,2500);
addJoin();
